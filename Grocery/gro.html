<!DOCTYPE html>
<html>
<head>
  <title>Grocery App</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      padding: 20px;
    }

    h2 {
      margin-top: 20px;
    }

    .box {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 5px;
    }

    button {
      margin-left: 10px;
      padding: 5px 10px;
      border: none;
      background: green;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: darkgreen;
    }

    .remove {
      background: red;
    }

    .remove:hover {
      background: darkred;
    }
  </style>
</head>
<body>

<h1>Grocery Store</h1>

<div class="box">
  <h2>Products</h2>
  <div id="products"></div>
</div>

<div class="box">
  <h2>Cart</h2>
  <div id="cart"></div>
  <p><b>Total: ₹<span id="total">0</span></b></p>
</div>

<script>
const products = [
  { id: 1, name: "Rice", price: 50 },
  { id: 2, name: "Milk", price: 30 },
  { id: 3, name: "Bread", price: 25 }
];

let cart = [];

function showProducts() {
  let html = "";
  products.forEach(p => {
    html += `${p.name} - ₹${p.price}
             <button onclick="add(${p.id})">Add</button><br><br>`;
  });
  document.getElementById("products").innerHTML = html;
}

function add(id) {
  let item = cart.find(p => p.id === id);
  if (item) item.qty++;
  else {
    let product = products.find(p => p.id === id);
    cart.push({ ...product, qty: 1 });
  }
  showCart();
}

function removeItem(id) {
  let index = cart.findIndex(p => p.id === id);
  if (cart[index].qty > 1) cart[index].qty--;
  else cart.splice(index, 1);
  showCart();
}

function showCart() {
  let html = "";
  let total = 0;

  if (cart.length === 0) {
    html = "Cart is empty";
  } else {
    cart.forEach(p => {
      total += p.price * p.qty;
      html += `${p.name} x ${p.qty}
               <button class="remove" onclick="removeItem(${p.id})">Remove</button><br><br>`;
    });
  }

  document.getElementById("cart").innerHTML = html;
  document.getElementById("total").innerText = total;
}

showProducts();
</script>

</body>
</html>
